apiVersion: v1
kind: ConfigMap
metadata:
  name: easyeduv2-config
  namespace: production
data:
  NODE_ENV: "production"
  PORT: "3000"
  S3_ENABLED: "true"
  S3_ENDPOINT: "https://s3.hn-1.cloud.cmctelecom.vn"
  S3_BUCKET: "easyedu"
  S3_REGION: "s3-hn-1"
  S3_PROTOCOL: "https"
  S3_HOSTNAME: "s3.hn-1.cloud.cmctelecom.vn"
  S3_ALIAS_HOST: "cdn3.emso.vn/easyedu"
  S3_FOLDER_PORTAL: "easyedu"
  TINODE_URL: "https://chattinode.easyedu.vn"
  TINODE_BOT_USER: "edumanage_bot_v2"
  TINODE_LOGIN_VERSION: "3"
  TINODE_USER_AGENT: "EduManage/1.0"
  TINODE_REQUEST_TIMEOUT_MS: "10000"
  TINODE_MAX_RETRIES: "-1"
  TINODE_RETRY_BACKOFF_MS: "5000"
  CENTER_ID: "easyeduv2"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  ZALO_GATEWAY_CALLBACK_URL: "https://easyeduv2.easyedu.vn/zalo/callback"
  ZALO_WEBHOOK_URL: "https://easyeduv2.easyedu.vn/zalo/webhook"
  CENTER_PUBLIC_URL: "https://easyeduv2.easyedu.vn"
