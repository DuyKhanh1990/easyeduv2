apiVersion: batch/v1
kind: Job
metadata:
  name: easyeduv2-db-bootstrap
  namespace: production
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: easyeduv2
        component: db-bootstrap
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: emso-harbo-production
      containers:
        - name: db-bootstrap
          # Kustomize applies the same pinned newTag as the app Deployment.
          image: harbor.emso.vn/emso-common/new-easyedu:0.0.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              if [ "${DB_BOOTSTRAP_ENABLED:-false}" != "true" ]; then
                echo "DB bootstrap is disabled for this center; skipping."
                exit 0
              fi
              node dist/db/migrate.cjs
              TARGET_DB_URL="$DATABASE_URL" node dist/db/seed-default.cjs
          envFrom:
            - configMapRef:
                name: easyeduv2-config
          env:
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easyeduv2-bootstrap
                  key: BOOTSTRAP_ADMIN_PASSWORD
                  optional: true
