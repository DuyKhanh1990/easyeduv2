apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - deployment.yaml
  - db-migrate-job.yaml
  - ingress.yaml
  - service.yaml
  - hpa.yaml
  - configmap.yaml
labels:
  - includeSelectors: true
    pairs:
      app: easyeduv2
      release: production
replacements:
  - source:
      kind: Deployment
      name: easyeduv2
      fieldPath: spec.template.spec.containers.[name=easyeduv2].image
    targets:
      - select:
          kind: Job
          name: easyeduv2-db-migrate
        fieldPaths:
          - spec.template.spec.containers.[name=migrate].image
