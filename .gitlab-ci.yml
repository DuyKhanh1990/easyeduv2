image: docker:27-cli

stages: [build_images]

variables:
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"
  DOCKER_DRIVER: overlay2
  DOCKER_REGISTRY: harbor.emso.vn
  REGISTRY_PROJECT: emso-common
  REGISTRY_IMAGE: new-easyedu
  DOCKER_IMAGE: $DOCKER_REGISTRY/$REGISTRY_PROJECT/$REGISTRY_IMAGE
  # REGISTRY_TAG: ${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}}
  REGISTRY_TAG: 0.1.86 #Thêm sync_user_tokens_controller.rb nân nodejs
emso-build-image:
  stage: build_images
  tags: [emso-runner]
  script:
    - echo "Login to Docker Registry"
    - echo "$HARBOR_ROBOT_TOKEN" | docker login --username "$HARBOR_ROBOT_USER" --password-stdin "$DOCKER_REGISTRY"
    - DOCKER_BUILDKIT=1 docker build --progress=plain -t "$DOCKER_IMAGE:$REGISTRY_TAG" .
    # Harbor có thể trả 500 tạm thời khi upload một layer lớn.
    # Retry toàn bộ push để Docker tiếp tục dùng lại các layer đã upload thành công.
    - |
      push_status=1
      for attempt in 1 2 3 4 5; do
        echo "Pushing image (attempt ${attempt}/5)..."
        if docker push "$DOCKER_IMAGE:$REGISTRY_TAG"; then
          push_status=0
          break
        fi
        if [ "$attempt" -lt 5 ]; then
          sleep $((attempt * 10))
        fi
      done
      exit "$push_status"
    - echo "Build xong rồi !"
  after_script:
    # Dọn rác để không đầy ổ của runner
    - docker image prune -af
    - docker builder prune -af
    - docker logout "$DOCKER_REGISTRY"
    - echo "Build xong rồi !"