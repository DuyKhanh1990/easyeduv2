image: docker:27-cli

workflow:
  rules:
    # Chạy pipeline cho merge request.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Nếu branch đã có merge request thì không chạy thêm pipeline push.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - db_schema_sync
  - build_images

variables:
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"
  DOCKER_DRIVER: overlay2
  DOCKER_REGISTRY: harbor.emso.vn
  REGISTRY_PROJECT: emso-common
  REGISTRY_IMAGE: new-easyedu
  DOCKER_IMAGE: "$DOCKER_REGISTRY/$REGISTRY_PROJECT/$REGISTRY_IMAGE"
  REGISTRY_TAG: "0.4.0"

apply-db-schema:
  stage: db_schema_sync
  image: node:20-alpine
  tags:
    - emso-runner
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - shared/schema.ts
        - drizzle.config.ts
        - scripts/push-db-direct.ts
        - scripts/apply-deploy-migrations.ts
        - migrations/deploy/*.sql
      when: manual
      allow_failure: false
    - when: never
  script:
    - test -n "$TARGET_DB_URL" || (echo "Set TARGET_DB_URL as a protected, masked GitLab CI variable before running this job." && exit 1)
    - apk add --no-cache python3 make g++
    - sed -i -E 's#http://package-firewall\.replit\.(local|internal)/npm/#https://registry.npmjs.org/#g' package-lock.json
    - npm ci --registry=https://registry.npmjs.org
    - npx tsx scripts/push-db-direct.ts
    - npx tsx scripts/apply-deploy-migrations.ts

emso-build-image:
  stage: build_images
  tags:
    - emso-runner
  script:
    - echo "Login to Docker Registry"
    - echo "$HARBOR_ROBOT_TOKEN" | docker login --username "$HARBOR_ROBOT_USER" --password-stdin "$DOCKER_REGISTRY"
    - DOCKER_BUILDKIT=1 docker build --build-arg APP_VERSION="${CI_COMMIT_SHA:-$REGISTRY_TAG}" --build-arg APP_DISPLAY_VERSION="$REGISTRY_TAG" --progress=plain -t "$DOCKER_IMAGE:$REGISTRY_TAG" .
    # Harbor có thể trả 500 tạm thời khi upload một layer lớn.
    # Retry toàn bộ push để Docker tiếp tục dùng lại các layer đã upload thành công.
    - |
      push_status=1
      for attempt in 1 2 3 4 5; do
        echo "Pushing image (attempt ${attempt}/5)..."
        if docker push "$DOCKER_IMAGE:$REGISTRY_TAG"; then
          push_status=0
          break
        fi
        if [ "$attempt" -lt 5 ]; then
          sleep $((attempt * 10))
        fi
      done
      exit "$push_status"
    - echo "Build xong rồi!"