            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      tinodeLogin: { type: string }
                      tinodeUid: { type: string }

  /chat/groups:
    get:
      tags: [Chat]
      summary: Danh sách nhóm chat
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            topicId: { type: string }
                            name: { type: string }
                            memberCount: { type: integer }
                            isCreator: { type: boolean }
                            createdAt: { type: string, format: date-time }
                      total: { type: integer }
                      permissions:
                        type: object
                        properties:
                          canCreate: { type: boolean }
    post:
      tags: [Chat]
      summary: Tạo nhóm chat mới (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                classId: { type: string, format: uuid, nullable: true }
                memberUids: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      topicId: { type: string }
                      name: { type: string }
                      createdAt: { type: string, format: date-time }

  /chat/classes/search:
    get:
      tags: [Chat]
      summary: Tìm lớp học để thêm vào nhóm chat
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK

  /chat/classes/{classId}/groups:
    get:
      tags: [Chat]
      summary: Các nhóm chat thuộc lớp học
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK

  /chat/classes/{classId}/members:
    get:
      tags: [Chat]
      summary: Danh sách thành viên lớp (để auto-fill nhóm chat)
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK

  # ════════════════════════════════════════════════════════════
  # SHARED — các route dùng prefix /api/ (không phải /api/mobile/)
  # nhưng vẫn được mobile app gọi
  # ════════════════════════════════════════════════════════════
  /student-sessions/{id}/review:
    get:
      tags: [Shared (non-mobile prefix)]
      summary: Lấy nhận xét (review) của một buổi học
      description: |
        Trả về reviewData và trạng thái published cho một student session.
        Route này dùng prefix `/api/` thay vì `/api/mobile/`.
        **URL thực tế:** `GET /api/student-sessions/{id}/review`
      servers:
        - url: /api
          description: Shared API prefix (không phải /api/mobile)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: "ID của student session" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviewData: { type: object, nullable: true, description: "Dữ liệu nhận xét (JSON)" }
                  reviewPublished: { type: boolean, description: "Nhận xét đã được public hay chưa" }
        "404":
          description: Không tìm thấy student session

