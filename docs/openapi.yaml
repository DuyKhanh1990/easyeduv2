  /staff/library:
    get:
      tags: [Staff - Library]
      summary: Thư viện tài liệu
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: programId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginationMeta" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            title: { type: string }
                            type: { type: string }
                            content: { type: string, nullable: true }
                            programId: { type: string, format: uuid, nullable: true }
                            programName: { type: string, nullable: true }
                            attachments: { type: array, items: { $ref: "#/components/schemas/AttachmentItem" } }
                            allowDownload: { type: boolean }
                            createdAt: { type: string, format: date-time }
    post:
      tags: [Staff - Library]
      summary: Tạo tài liệu mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                type: { type: string }
                content: { type: string }
                programId: { type: string, format: uuid }
      responses:
        "200":
          description: OK

