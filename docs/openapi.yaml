  # ════════════════════════════════════════════════════════════
  # TASKS
  # ════════════════════════════════════════════════════════════
  /tasks/kanban:
    get:
      tags: [Tasks]
      summary: Kanban board (nhóm theo status)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions: { $ref: "#/components/schemas/TaskPermissions" }
                  statuses: { type: array, items: { type: object } }
                  levels: { type: array, items: { type: object } }
                  columns:
                    type: array
                    items:
                      type: object
                      properties:
                        status: { type: object, nullable: true }
                        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }

  /tasks/meta:
    get:
      tags: [Tasks]
      summary: Metadata cho tạo/lọc task
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions: { $ref: "#/components/schemas/TaskPermissions" }
                  statuses: { type: array, items: { type: object } }
                  levels: { type: array, items: { type: object } }
                  staff:
                    type: array
                    items: { $ref: "#/components/schemas/StaffRef" }
                  locations: { type: array, items: { type: object } }
                  departments: { type: array, items: { type: object } }

  /tasks:
    get:
      tags: [Tasks]
      summary: Danh sách task (có filter)
      parameters:
        - { name: statusId, in: query, schema: { type: string, format: uuid } }
        - { name: levelId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions: { $ref: "#/components/schemas/TaskPermissions" }
                  tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
    post:
      tags: [Tasks]
      summary: Tạo task mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, locationIds]
              properties:
                title: { type: string }
                content: { type: string }
                locationIds: { type: array, items: { type: string, format: uuid } }
                departmentId: { type: string, format: uuid, nullable: true }
                statusId: { type: string, format: uuid, nullable: true }
                levelId: { type: string, format: uuid, nullable: true }
                dueDate: { type: string, format: date-time, nullable: true }
                subjectIds: { type: array, items: { type: string, format: uuid } }
                managerIds: { type: array, items: { type: string, format: uuid } }
                assigneeIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Task vừa tạo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Chi tiết task
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
    patch:
      tags: [Tasks]
      summary: Cập nhật task
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                statusId: { type: string, format: uuid, nullable: true }
                levelId: { type: string, format: uuid, nullable: true }
                dueDate: { type: string, format: date-time, nullable: true }
                assigneeIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Task đã cập nhật
    delete:
      tags: [Tasks]
      summary: Xoá task
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã xoá công việc" }

  /tasks/{id}/attachments:
    get:
      tags: [Tasks]
      summary: Danh sách file đính kèm của task
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttachmentItem" }
    post:
      tags: [Tasks]
      summary: Upload file đính kèm
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: OK
    delete:
      tags: [Tasks]
      summary: Xoá file đính kèm
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        "200":
          description: OK

  /tasks/{id}/comments:
    get:
      tags: [Tasks]
      summary: Bình luận của task
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskComment" }
    post:
      tags: [Tasks]
      summary: Thêm bình luận
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskComment" }

  /tasks/{taskId}/comments/{commentId}:
    delete:
      tags: [Tasks]
      summary: Xoá bình luận
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã xoá bình luận" }

  # ════════════════════════════════════════════════════════════
  # NEWS FEED
  # ════════════════════════════════════════════════════════════
  /news-feed:
    get:
      tags: [News Feed]
      summary: Danh sách bài đăng
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [thong-bao, su-kien, hoat-dong, hoc-thuat, all]
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions: { type: object }
                  posts: { type: array, items: { $ref: "#/components/schemas/Post" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
    post:
      tags: [News Feed]
      summary: Tạo bài đăng mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, content]
              properties:
                category:
                  type: string
                  enum: [thong-bao, su-kien, hoat-dong, hoc-thuat]
                content: { type: string }
                imageUrl: { type: string, nullable: true }
                imageUrls: { type: array, items: { type: string } }
                locationId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Bài đăng đã tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  post: { $ref: "#/components/schemas/Post" }
        "403":
          description: Không có quyền đăng bài

  /news-feed/pinned:
    get:
      tags: [News Feed]
      summary: Bài đăng ghim (tối đa 3)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts: { type: array, items: { $ref: "#/components/schemas/Post" } }

  /news-feed/{id}:
    get:
      tags: [News Feed]
      summary: Chi tiết bài đăng
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
    patch:
      tags: [News Feed]
      summary: Chỉnh sửa bài đăng
      description: Yêu cầu quyền canEdit và phải là tác giả (trừ superAdmin).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                category:
                  type: string
                  enum: [thong-bao, su-kien, hoat-dong, hoc-thuat]
                imageUrls: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  post: { $ref: "#/components/schemas/Post" }
        "403":
          description: Không có quyền hoặc không phải tác giả
        "404":
          description: Không tìm thấy bài đăng
    delete:
      tags: [News Feed]
      summary: Xoá bài đăng
      description: Yêu cầu quyền canDelete và phải là tác giả (trừ superAdmin).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã xoá bài viết." }
        "403":
          description: Không có quyền hoặc không phải tác giả
        "404":
          description: Không tìm thấy bài đăng

  /news-feed/{id}/react:
    post:
      tags: [News Feed]
      summary: Thả / bỏ reaction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction: { type: string }
      responses:
        "200":
          description: OK

  /news-feed/{id}/pin:
    patch:
      tags: [News Feed]
      summary: Ghim / bỏ ghim bài đăng
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isPinned: { type: boolean }

