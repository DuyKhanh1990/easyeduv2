      parameters:
        - { name: month, in: query, schema: { type: integer, example: 7 } }
        - { name: year, in: query, schema: { type: integer, example: 2025 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sheetId: { type: string, format: uuid }
                  sheetName: { type: string }
                  sheetMonth: { type: string }
                  soCong: { type: number }
                  luongCB: { type: number }
