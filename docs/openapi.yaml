openapi: 3.0.3
info:
  title: EduManage Mobile API
  description: |
    Toàn bộ các endpoint dành cho ứng dụng mobile (student, parent, staff).

    **Authentication:** Hầu hết endpoint yêu cầu JWT Bearer token.
    Lấy token qua `POST /api/mobile/auth/login` hoặc `POST /api/mobile/auth/zalo`.

    ```
    Authorization: Bearer <token>
    ```
  version: "1.0.0"
  contact:
    name: Web Team

servers:
  - url: /api/mobile
    description: Mobile API prefix

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Common ─────────────────────────────────────────────
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    AttachmentItem:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        size: { type: integer }
        mimetype: { type: string }

    StaffRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        code: { type: string }

    StudentRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }

    # ─── Auth ────────────────────────────────────────────────
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        center: { type: object }
        needsOnboarding: { type: boolean }
        userType:
          type: string
          enum: [staff, student, parent, unknown]
        profile: { type: object, nullable: true }

    # ─── Session ─────────────────────────────────────────────
    SessionSummary:
      type: object
      properties:
        classSessionId: { type: string, format: uuid }
        sessionDate: { type: string, format: date }
        sessionIndex: { type: integer, nullable: true }
        weekday: { type: string }
        className: { type: string }
        classCode: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        learningFormat: { type: string }
        onlineLink: { type: string, nullable: true }
        sessionStatus: { type: string }
        locationName: { type: string, nullable: true }

    # ─── Task ────────────────────────────────────────────────
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string, nullable: true }
        statusId: { type: string, format: uuid, nullable: true }
        levelId: { type: string, format: uuid, nullable: true }
        departmentId: { type: string, format: uuid, nullable: true }
        dueDate: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        managers:
          type: array
          items: { $ref: "#/components/schemas/StaffRef" }
        assignees:
          type: array
          items: { $ref: "#/components/schemas/StaffRef" }

    TaskComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        content: { type: string }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }

    TaskPermissions:
      type: object
      properties:
        canView: { type: boolean }
        canViewAll: { type: boolean }
        canCreate: { type: boolean }
        canEdit: { type: boolean }
        canDelete: { type: boolean }

    # ─── News Feed ───────────────────────────────────────────
    Post:
      type: object
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        authorRole: { type: string }
        category:
          type: string
          enum: [thong-bao, su-kien, hoat-dong, hoc-thuat]
        content: { type: string }
        imageUrl: { type: string, nullable: true }
        imageUrls:
          type: array
          items: { type: string }
        isPinned: { type: boolean }
        locationId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reactions: { type: object, additionalProperties: { type: integer } }
        myReaction: { type: string, nullable: true }

    # ─── Notification ────────────────────────────────────────
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        type: { type: string }
        category: { type: string }
        referenceId: { type: string, nullable: true }
        referenceType: { type: string, nullable: true }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        deeplink:
          type: object
          properties:
            screen: { type: string }
            params: { type: object }

    # ─── Salary ──────────────────────────────────────────────
    SalarySession:
      type: object
      properties:
        sessionDate: { type: string, format: date }
        sessionIndex: { type: integer, nullable: true }
        weekday: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        isEligible: { type: boolean }
        salaryForSession: { type: number }

    SalaryClass:
      type: object
      properties:
        classId: { type: string, format: uuid }
        className: { type: string }
        role: { type: string }
        packageId: { type: string, format: uuid, nullable: true }
        packageName: { type: string, nullable: true }
        packageType: { type: string, nullable: true }
        totalEligibleSessions: { type: integer }
        totalSalary: { type: number }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SalarySession" }

security:
  - bearerAuth: []

paths:

  # ════════════════════════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập bằng username/password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: teacher01 }
                password: { type: string, format: password }
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Sai thông tin đăng nhập

  /auth/zalo:
    post:
      tags: [Auth]
      summary: Đăng nhập qua Zalo Mini App
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessToken]
              properties:
                accessToken: { type: string }
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Access token không hợp lệ

  # ════════════════════════════════════════════════════════════
  # SCHEDULE
  # ════════════════════════════════════════════════════════════
  /schedule/today:
    get:
      tags: [Schedule]
      summary: Lịch hôm nay (student & staff)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  userType: { type: string }
                  date: { type: string, format: date }
                  sessions:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/SessionSummary" }
                        - type: object
                          properties:
                            studentSessionId: { type: string, format: uuid, nullable: true }
                            teacherNames: { type: array, items: { type: string } }
                            attendanceStatus: { type: string, nullable: true }
                            attendanceNote: { type: string, nullable: true }
                            enrolledCount: { type: integer, nullable: true }
                            pendingCount: { type: integer, nullable: true }

  # ════════════════════════════════════════════════════════════
  # STUDENT / PARENT — CALENDAR
  # ════════════════════════════════════════════════════════════
  /student/calendar:
    get:
      tags: [Student - Calendar]
      summary: Lịch học tháng (full sessions)
      parameters:
        - { name: month, in: query, schema: { type: string, example: "2025-07" }, description: "Tháng theo định dạng YYYY-MM" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  datesWithSessions: { type: array, items: { type: string, format: date } }
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionSummary" }

  /student/calendar/month:
    get:
      tags: [Student - Calendar]
      summary: Những ngày có buổi học trong tháng (chấm dot)
      parameters:
        - { name: month, in: query, schema: { type: string, example: "2025-07" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  datesWithSessions: { type: array, items: { type: string, format: date } }

  /student/calendar/day:
    get:
      tags: [Student - Calendar]
      summary: Chi tiết các buổi học trong ngày
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date, example: "2025-07-10" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  sessions:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/SessionSummary" }
                        - type: object
                          properties:
                            reviewData:
                              type: array
                              items:
                                type: object
                                properties:
                                  teacherName: { type: string }
                                  criteria:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        criteriaName: { type: string }
                                        rating: { type: number, nullable: true }
                                        items:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              subCriteriaName: { type: string }
                                              comment: { type: string }
                            content:
                              type: object
                              properties:
                                general: { type: array, items: { type: object } }
                                personal: { type: array, items: { type: object } }

  /student/session/{classSessionId}:
    get:
      tags: [Student - Calendar]
      summary: Chi tiết một buổi học (nội dung + điểm danh)
      parameters:
        - { name: classSessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK

  /student/session/{classSessionId}/online-click:
    post:
      tags: [Student - Calendar]
      summary: Ghi nhận học viên bấm vào link học online
      description: |
        Đánh dấu thời điểm học viên click vào link học online (onlineClickedAt).
        Phải gọi trước online-end. Sẽ lỗi nếu buổi học online đã kết thúc.
      parameters:
        - { name: classSessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: studentId, in: query, schema: { type: string, format: uuid }, description: "ID học viên (phụ huynh chọn con)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineClickedAt: { type: string, format: date-time }
        "400":
          description: Buổi học online đã kết thúc
        "404":
          description: Không tìm thấy buổi học

  /student/session/{classSessionId}/online-end:
    post:
      tags: [Student - Calendar]
      summary: Ghi nhận kết thúc học online
      parameters:
        - { name: classSessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK

  /online-learning-rules:
    get:
      tags: [Student - Calendar]
      summary: Cấu hình thời gian mở nút học online theo cơ sở
      description: |
        Trả về danh sách rule theo từng locationId.
        Mobile dùng để tính `canJoin` / `canEnd` cho button link học online.
        Không cần role cụ thể — mọi user đã đăng nhập đều xem được.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    locationId: { type: string, format: uuid }
                    earlyEntryMinutes: { type: integer, description: "Phút được vào trước giờ học" }
                    lateEntryMinutes: { type: integer, description: "Phút được vào muộn tối đa" }
                    earlyEndMinutes: { type: integer, description: "Phút được kết thúc sớm" }

  /test-content-attempt:
    post:
      tags: [Student - Assignments]
      summary: Kiểm tra + ghi nhận lượt làm bài trong buổi kiểm tra TEST
      description: |
        Kiểm tra số lượt còn lại cho một nội dung (contentId) trong buổi test (testSessionId).
        Nếu còn lượt → ghi nhận lượt mới và trả về `allowed: true`.
        Nếu hết lượt → trả về `allowed: false` (không ghi nhận).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testSessionId, contentId]
              properties:
                testSessionId: { type: string, format: uuid }
                contentId: { type: string, format: uuid }
                contentType:
                  type: string
                  default: assignment
                  description: "Loại nội dung (vd: assignment, exam). Server mặc định là 'assignment'."
                studentId: { type: string, format: uuid, description: "ID học viên (phụ huynh chọn con)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  attemptsUsed: { type: integer }
                  maxAttempts: { type: integer, nullable: true }
        "400":
          description: Thiếu testSessionId hoặc contentId
        "403":
          description: Không phải tài khoản học viên
        "404":
          description: Không tìm thấy buổi test

  # ════════════════════════════════════════════════════════════
  # STUDENT — ASSIGNMENTS
  # ════════════════════════════════════════════════════════════
  /student/assignments:
    get:
      tags: [Student - Assignments]
      summary: Danh sách bài tập / đề thi
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [submitted, pending] } }
        - { name: itemType, in: query, schema: { type: string, enum: [BTVN, exam] } }
        - { name: className, in: query, schema: { type: string } }
        - { name: month, in: query, schema: { type: string, example: "2025-07" } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginationMeta" }
                  - type: object
                    properties:
                      month: { type: string, nullable: true }
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            itemType: { type: string, enum: [BTVN, exam] }
                            classSessionId: { type: string, format: uuid }
                            className: { type: string }
                            classCode: { type: string }
                            sessionDate: { type: string, format: date }
                            weekday: { type: string }
                            sessionIndex: { type: integer, nullable: true }
                            startTime: { type: string }
                            endTime: { type: string }
                            homeworkId: { type: string, format: uuid, nullable: true }
                            title: { type: string }
                            description: { type: string, nullable: true }
                            attachments: { type: array, items: { $ref: "#/components/schemas/AttachmentItem" } }
                            isPersonalized: { type: boolean }
                            submissionStatus: { type: string, nullable: true }
                            submissionContent: { type: string, nullable: true }
                            submissionAttachments: { type: array, items: { type: string } }
                            studentSessionContentId: { type: string, format: uuid, nullable: true }
                            score: { type: number, nullable: true }
                            comment: { type: string, nullable: true }
                            dueDate: { type: string, format: date-time, nullable: true }
                            examId: { type: string, format: uuid, nullable: true }
                            maxAttempts: { type: integer, nullable: true }
                            attemptsUsed: { type: integer }
                            student: { $ref: "#/components/schemas/StudentRef" }
                            isParent: { type: boolean }

  /student/assignments/submit:
    post:
      tags: [Student - Assignments]
      summary: Nộp bài tập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [homeworkId]
              properties:
                homeworkId: { type: string, format: uuid }
                submissionContent: { type: string }
                submissionAttachments: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /student/exam/{examId}/attempt-count:
    get:
      tags: [Student - Assignments]
      summary: Số lần thi đã dùng
      parameters:
        - { name: examId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: studentId, in: query, schema: { type: string, format: uuid } }
        - { name: classId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  maxAttempts: { type: integer, nullable: true }

  # ════════════════════════════════════════════════════════════
  # STUDENT — FINANCE & REWARDS
  # ════════════════════════════════════════════════════════════
  /student/invoices:
    get:
      tags: [Student - Finance]
      summary: Lịch sử học phí (student/parent)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK

  /student/stars:
    get:
      tags: [Student - Finance]
      summary: Lịch sử điểm thưởng (sao)
      responses:
        "200":
          description: OK

  /student/score-sheet:
    get:
      tags: [Student - Academics]
      summary: Bảng điểm học sinh
      parameters:
        - { name: classId, in: query, schema: { type: string, format: uuid } }
        - { name: month, in: query, schema: { type: string, example: "2025-07" } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginationMeta" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            title: { type: string }
                            classCode: { type: string }
                            className: { type: string }
                            scoreSheetName: { type: string }
                            sessionIndex: { type: integer, nullable: true }
                            sessionDate: { type: string, format: date }
                            weekday: { type: string }
                            startTime: { type: string }
                            endTime: { type: string }
                            scores:
                              type: array
                              items:
                                type: object
                                properties:
                                  categoryId: { type: string, format: uuid }
                                  categoryName: { type: string }
                                  score: { type: number }
                            teacherComment: { type: string, nullable: true }
                            createdByName: { type: string }
                            student: { $ref: "#/components/schemas/StudentRef" }
                            isParent: { type: boolean }

  # ════════════════════════════════════════════════════════════
  # PARENT PROFILE
  # ════════════════════════════════════════════════════════════
  /parent/profile:
    get:
      tags: [Parent]
      summary: Hồ sơ phụ huynh và danh sách học sinh liên kết
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  parent:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      code: { type: string }
                      fullName: { type: string }
                      type: { type: string }
                      phone: { type: string }
                      email: { type: string, nullable: true }
                      dateOfBirth: { type: string, format: date, nullable: true }
                      gender: { type: string, nullable: true }
                      address: { type: string, nullable: true }
                      relationship: { type: string, nullable: true }
                      accountStatus: { type: string }
                      status: { type: string }
                  linkedStudents:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        fullName: { type: string }
                        enrolledClasses:
                          type: array
                          items:
                            type: object
                            properties:
                              classId: { type: string, format: uuid }
                              classCode: { type: string }
                              className: { type: string }
                              status: { type: string }
                              startDate: { type: string, format: date, nullable: true }
                              endDate: { type: string, format: date, nullable: true }
                              totalSessions: { type: integer }
                              attendedSessions: { type: integer }
                              remainingSessions: { type: integer }

  # ════════════════════════════════════════════════════════════
  # NOTIFICATIONS
  # ════════════════════════════════════════════════════════════
  /student/notifications:
    get:
      tags: [Notifications]
      summary: Thông báo học sinh / phụ huynh (student token)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUnread: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }

  /student/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Số thông báo chưa đọc (student)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
