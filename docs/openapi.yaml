                  luongTheoCong: { type: number }
                  phuCap: { type: number }
                  thuong: { type: number }
                  phat: { type: number }
                  luongDungLop: { type: number }
                  tongLuong: { type: number }
                  bhxh: { type: number }
                  bhyt: { type: number }
                  bhtn: { type: number }
                  thueTNCN: { type: number }
                  tamUng: { type: number }
                  thucNhan: { type: number }
                  daChi: { type: number }

  # ════════════════════════════════════════════════════════════
  # STAFF — CALENDAR
  # ════════════════════════════════════════════════════════════
  /staff/calendar:
    get:
      tags: [Staff - Calendar]
      summary: Lịch dạy tháng
      parameters:
        - { name: month, in: query, schema: { type: string, example: "2025-07" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  datesWithSessions: { type: array, items: { type: string, format: date } }
                  sessions:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/SessionSummary" }
                        - type: object
                          properties:
                            checkInAt: { type: string, format: date-time, nullable: true }
                            checkOutAt: { type: string, format: date-time, nullable: true }
                            isTestSession: { type: boolean }

  /staff/calendar/day:
    get:
      tags: [Staff - Calendar]
      summary: Lịch dạy trong ngày
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  sessions:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/SessionSummary" }
                        - type: object
                          properties:
                            enrolledCount: { type: integer }
                            attendancePendingCount: { type: integer }
                            checkInAt: { type: string, format: date-time, nullable: true }
                            checkOutAt: { type: string, format: date-time, nullable: true }

  /staff/calendar/session/{classSessionId}:
    get:
      tags: [Staff - Calendar]
      summary: Chi tiết một buổi dạy (staff view)
      parameters:
        - { name: classSessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  classSessionId: { type: string, format: uuid }
                  classId: { type: string, format: uuid }
                  sessionDate: { type: string, format: date }
                  weekday: { type: string }
                  className: { type: string }
                  classCode: { type: string }
                  startTime: { type: string }
                  endTime: { type: string }
                  learningFormat: { type: string }
                  onlineLink: { type: string, nullable: true }
                  sessionStatus: { type: string }
                  sessionIndex: { type: integer, nullable: true }
                  totalSessions: { type: integer, nullable: true }
                  locationName: { type: string, nullable: true }
                  teachers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        fullName: { type: string }
                  generalContents: { type: array, items: { type: object } }
                  enrolledCount: { type: integer }
                  attendancePendingCount: { type: integer }
                  reviewedCount: { type: integer }
                  checkInAt: { type: string, format: date-time, nullable: true }
                  checkOutAt: { type: string, format: date-time, nullable: true }
                  isTestSession: { type: boolean }

  /staff/calendar/session/{classSessionId}/students:
    get:
      tags: [Staff - Calendar]
      summary: Danh sách học sinh trong buổi dạy
      parameters:
        - { name: classSessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    studentSessionId: { type: string, format: uuid }
                    studentId: { type: string, format: uuid }
                    studentName: { type: string }
                    studentCode: { type: string }
                    attendanceStatus: { type: string, nullable: true }
                    attendanceNote: { type: string, nullable: true }
                    sessionOrder: { type: integer, nullable: true }
                    hasReview: { type: boolean }
                    reviewPublished: { type: boolean }

  /staff/calendar/session/{classSessionId}/contents:
    get:
      tags: [Staff - Calendar]
      summary: Nội dung buổi học (của giáo viên)
      parameters:
        - { name: classSessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    contentType: { type: string }
                    title: { type: string }
                    description: { type: string, nullable: true }
                    resourceUrl: { type: string, nullable: true }
                    displayOrder: { type: integer }
                    dueDate: { type: string, format: date-time, nullable: true }
    post:
      tags: [Staff - Calendar]
      summary: Thêm nội dung vào buổi học
      parameters:
        - { name: classSessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libraryContentId: { type: string, format: uuid, nullable: true }
                contentType: { type: string }
                title: { type: string }
                description: { type: string }
                dueDate: { type: string, format: date-time }
      responses:
        "200":
          description: OK

  /staff/calendar/session/{classSessionId}/contents/{contentId}:
    delete:
      tags: [Staff - Calendar]
      summary: Xoá nội dung khỏi buổi học
      parameters:
        - { name: classSessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: contentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Xoá thành công

