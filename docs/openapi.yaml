  # ════════════════════════════════════════════════════════════
  # STAFF — FINANCE
  # ════════════════════════════════════════════════════════════
  /staff/invoices:
    get:
      tags: [Staff - Finance]
      summary: Hoá đơn học phí cần thu (staff)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        invoiceId: { type: string }
                        title: { type: string }
                        code: { type: string }
                        amount: { type: number }
                        paidAmount: { type: number }
                        remainingAmount: { type: number }
                        status: { type: string }
                        dueDate: { type: string, format: date, nullable: true }
