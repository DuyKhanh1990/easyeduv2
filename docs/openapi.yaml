  # ════════════════════════════════════════════════════════════
  # STAFF — PAYROLL / SALARY
  # ════════════════════════════════════════════════════════════
  /staff/payroll/published-rows:
    get:
      tags: [Staff - Payroll]
      summary: Chi tiết từng lớp từ bảng lương đã publish
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    salaryTableId: { type: string, format: uuid }
                    salaryTableName: { type: string }
                    startDate: { type: string, format: date }
                    endDate: { type: string, format: date }
                    locationName: { type: string }
                    teacherId: { type: string, format: uuid }
                    teacherName: { type: string }
                    teacherCode: { type: string }
                    classId: { type: string, format: uuid }
                    className: { type: string }
                    role: { type: string }
                    packageId: { type: string, format: uuid, nullable: true }
                    sessions: { type: integer }
                    sessionDates: { type: array, items: { type: string, format: date } }

  /staff/payroll/salary-summary:
    get:
      tags: [Staff - Payroll]
      summary: Tóm tắt bảng lương (nhóm theo bảng lương)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    salaryTableId: { type: string, format: uuid }
                    salaryTableName: { type: string }
                    startDate: { type: string, format: date }
                    endDate: { type: string, format: date }
                    locationName: { type: string }
                    classes:
                      type: array
                      items:
                        type: object
                        properties:
                          classId: { type: string, format: uuid }
                          className: { type: string }
                          role: { type: string }
                          totalSalary: { type: number }
                    grandTotal: { type: number }

  /staff/salary-tables/{id}/breakdown:
    get:
      tags: [Staff - Payroll]
      summary: Chi tiết đầy đủ một bảng lương (kèm session-level)
      description: |
        Thay thế cặp `salary-summary` + `published-rows`.
        Trả về từng buổi dạy với số tiền tính được và trạng thái eligible.
      parameters:
        - { name: id, in: path, required: true, description: salaryTableId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  salaryTableId: { type: string, format: uuid }
                  salaryTableName: { type: string }
                  startDate: { type: string, format: date }
                  endDate: { type: string, format: date }
                  locationName: { type: string }
                  grandTotal: { type: number }
                  classes:
                    type: array
                    items: { $ref: "#/components/schemas/SalaryClass" }
        "403":
          description: Bảng lương chưa được công bố cho giáo viên này
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "404":
          description: Không tìm thấy bảng lương

  /staff/payroll/attendance:
    get:
      tags: [Staff - Payroll]
      summary: Chấm công theo tháng
      parameters:
        - { name: month, in: query, schema: { type: integer, example: 7 } }
        - { name: year, in: query, schema: { type: integer, example: 2025 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    workDate: { type: string, format: date }
                    timeIn: { type: string, nullable: true }
                    timeOut: { type: string, nullable: true }
                    tongCong: { type: number, nullable: true }
                    workedHours: { type: number, nullable: true }
                    note: { type: string, nullable: true }

  /staff/payroll/hr-summary:
    get:
      tags: [Staff - Payroll]
